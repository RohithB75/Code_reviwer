version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    # expose the container port 8000 to host 8001 to match local dev usage
    ports:
      - "8001:8000"
    volumes:
      # mount source for live-edit during development
      - ./backend/app:/app/app:delegated
      - ./backend/requirements.txt:/app/requirements.txt:ro
      - ./.env:/app/.env:ro
    environment:
      # ensure pydantic_settings receives a valid JSON array for cors_origins
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:8501"]
    networks:
      - ai_code_reviewer_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app:delegated
    networks:
      - ai_code_reviewer_network
    restart: unless-stopped

networks:
  ai_code_reviewer_network:
    driver: bridge

volumes: {}
